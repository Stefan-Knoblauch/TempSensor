<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one-screen app. Top bar with tabs; 3-D stage left; spec panel right (bottom sheet on phones).
   Single deliberate look: Northern Cape dusk. Ballast charcoal ground, sand text, ochre accent, ore-red selection. */
:root {
  color-scheme: dark;
  --ink: #15130f;          /* page ground: ballast charcoal */
  --stage: #1d1a16;        /* 3-D stage backdrop (unit view) */
  --panel: #211e19;        /* side panel */
  --line: #3a352c;         /* hairlines */
  --sand: #efe4cf;         /* primary text */
  --dust: #b3a68e;         /* secondary text */
  --ochre: #e2a04f;        /* accent: Kalahari ochre */
  --ore: #c4532e;          /* selection / haematite */
  --ok: #7fb069; --warn: #e8b33f; --hot: #e2763a; --crit: #d8433a;
  --f-display: "Saira Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--sand); font: 15px/1.45 var(--f-body); overflow: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ochre); outline-offset: 2px; }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; padding-top: env(safe-area-inset-top, 0px); }

/* top bar */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--ink); }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { margin: 0; font: 700 22px/1 var(--f-display); letter-spacing: .02em; text-transform: uppercase; }
.brand span { font: 400 12px var(--f-mono); color: var(--dust); white-space: nowrap; }
.tabs { display: flex; gap: 4px; margin-left: auto; }
.tab { background: none; border: 1px solid transparent; border-radius: 4px; padding: 6px 12px; cursor: pointer; font: 600 15px var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--dust); }
.tab[aria-selected="true"] { color: var(--ink); background: var(--ochre); }
.tab:hover:not([aria-selected="true"]) { color: var(--sand); border-color: var(--line); }
.seg { display: flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 5px 10px; cursor: pointer; font: 600 12px var(--f-mono); color: var(--dust); }
.seg button[aria-pressed="true"] { background: var(--line); color: var(--sand); }

/* main */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; min-height: 0; }
.stage { position: relative; min-height: 0; overflow: hidden; background: var(--stage); }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.labels { position: absolute; inset: 0; pointer-events: none; }
.hint { position: absolute; left: 16px; top: 14px; max-width: 34ch; padding: 8px 12px; border-left: 2px solid var(--ochre); background: rgba(21,19,15,.72); font-size: 14px; color: var(--sand); pointer-events: none; transition: opacity .4s; }
@media (max-width: 860px) { .hint.open { display: none; } }
.hint b { font-family: var(--f-display); letter-spacing: .04em; text-transform: uppercase; color: var(--ochre); }
.tools { position: absolute; left: 16px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: 6px; }
.tools button { background: rgba(21,19,15,.82); border: 1px solid var(--line); border-radius: 4px; padding: 7px 12px; cursor: pointer; font: 600 13px var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
.tools button:hover { border-color: var(--ochre); }
.tools button[aria-pressed="true"] { border-color: var(--ochre); color: var(--ochre); }

.badge { pointer-events: none; visibility: hidden; cursor: pointer; font: 600 11px/1 var(--f-mono); color: var(--ink); background: var(--sand); border-radius: 10px; padding: 4px 6px; border: 0; transform: translateY(-14px); opacity: 0; transition: opacity .35s, background .2s; white-space: nowrap; }
.badge.show { opacity: 1; pointer-events: auto; visibility: visible; }
.badge.sel { background: var(--ore); color: var(--sand); }
.badge .nm { display: none; font-family: var(--f-body); font-weight: 600; margin-left: 6px; }
.badge:hover .nm, .badge.sel .nm { display: inline; }
.readout { pointer-events: none; font: 600 12px/1.3 var(--f-mono); background: rgba(21,19,15,.85); border: 1px solid var(--line); border-left: 3px solid var(--lvl, var(--ok)); padding: 6px 9px; border-radius: 3px; transform: translateY(-34px); white-space: nowrap; }
.readout small { display: block; font-weight: 400; color: var(--dust); }

/* panel */
.panel { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 18px 18px calc(24px + env(safe-area-inset-bottom, 0px)); min-width: 0; }
.panel h2 { margin: 0 0 4px; font: 700 26px/1.05 var(--f-display); text-transform: uppercase; letter-spacing: .02em; text-wrap: balance; }
.panel h3 { margin: 22px 0 8px; font: 600 13px var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--dust); }
.eyebrow { font: 600 12px var(--f-mono); color: var(--ochre); letter-spacing: .04em; }
.panel p { margin: 8px 0; max-width: 60ch; }
dl.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 10px 0; font-size: 14px; }
dl.kv dt { color: var(--dust); }
dl.kv dd { margin: 0; font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
.plist { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.plist button { width: 100%; display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: baseline; text-align: left; background: none; border: 0; border-radius: 3px; padding: 5px 6px; cursor: pointer; }
.plist button:hover { background: var(--line); }
.plist button.sel { background: var(--ore); }
.plist .r { font: 600 12px var(--f-mono); color: var(--dust); }
.plist button.sel .r { color: var(--sand); }
.plist .g { font-size: 12px; color: var(--dust); }
.chip { display: inline-block; font: 600 11px var(--f-mono); padding: 2px 7px; border-radius: 10px; border: 1px solid currentColor; }
.lvl { font: 700 34px/1 var(--f-display); font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--ochre); }
.row { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { background: none; border: 1px solid var(--line); border-radius: 4px; padding: 7px 12px; cursor: pointer; font: 600 13px var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
.btn:hover { border-color: var(--ochre); }
.btn.primary { background: var(--ochre); color: var(--ink); border-color: var(--ochre); }
a { color: var(--ochre); }
.note { font-size: 13px; color: var(--dust); }

/* parts view */
.sheet { overflow: auto; padding: 22px 16px calc(32px + env(safe-area-inset-bottom, 0px)); }
.sheet-inner { max-width: 1180px; margin: 0 auto; display: grid; gap: 18px; }
.totals { display: flex; flex-wrap: wrap; gap: 28px; align-items: end; }
.totals .t { display: grid; gap: 2px; }
.totals .t span { font: 600 12px var(--f-mono); color: var(--dust); text-transform: uppercase; letter-spacing: .06em; }
.totals .t b { font: 700 34px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; }
table { border-collapse: collapse; width: 100%; min-width: 980px; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 600 12px var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--dust); background: var(--panel); position: sticky; top: 0; }
td.n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
tr.dim td { opacity: .45; }
.st-verified { color: var(--ok); } .st-from-search-snippet { color: var(--warn); } .st-estimate { color: var(--hot); } .st-not-found { color: var(--crit); }

@media (max-width: 860px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .stage { height: 62vh; min-height: 340px; }
  .panel { border-left: 0; border-top: 1px solid var(--line); }
  .tabs { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

      for (let k = 0; k < 6; k++) { const d = new THREE.Mesh(new THREE.CylinderGeometry(.09, .09, .05, 14), insul); d.rotation.x = Math.PI / 2; d.position.set(0, y, .35 + k * .07); m.add(d); }

    if (i < masts.length - 1) {

function buildTrain() {
  const group = new THREE.Group();
  const deck = 1.25;
  const locoLen = 21.6, locoW = 3.05, locoH = 3.15;
  const prof = new THREE.Shape([[0, 0], [locoLen, 0], [locoLen, locoH * .55], [locoLen - .9, locoH], [.9, locoH], [0, locoH * .55]].map(([x, y]) => new THREE.Vector2(x, y)));
  const bodyGeo = new THREE.ExtrudeGeometry(prof, { depth: locoW, bevelEnabled: true, bevelSize: .06, bevelThickness: .06, bevelSegments: 2 });
  bodyGeo.translate(-locoLen / 2, deck, -locoW / 2);
  const locoMat = new THREE.MeshPhysicalMaterial({ color: '#8f2a22', roughness: .45, clearcoat: .5 });
  const stripe = new THREE.MeshStandardMaterial({ color: '#e6b33a', roughness: .5 });
  const glass = new THREE.MeshPhysicalMaterial({ color: '#1d2a33', roughness: .05, metalness: .3, clearcoat: 1 });
  const dark = new THREE.MeshStandardMaterial({ color: '#1f1f20', roughness: .7, metalness: .3 });
  const wheel = new THREE.MeshStandardMaterial({ color: '#3a3836', metalness: .8, roughness: .45 });
  const locos = [];
  const bogie = (len, axles) => {
    const b = new THREE.Group();
    const fr = new THREE.Mesh(new THREE.BoxGeometry(len, .55, 2.5), dark); fr.position.y = .78; b.add(fr);
    for (let a = 0; a < axles; a++) for (const s of [-1, 1]) {
      const w = new THREE.Mesh(new THREE.CylinderGeometry(.53, .53, .14, 28), wheel); w.rotation.x = Math.PI / 2;
      w.position.set(-len / 2 + .55 + a * (len - 1.1) / Math.max(1, axles - 1), .53, s * (GAUGE / 2 + .02)); b.add(w);
    }
    return b;
  };
  for (let i = 0; i < 3; i++) {
    const g = new THREE.Group();
    g.add(new THREE.Mesh(bodyGeo, locoMat));
    for (const s of [-1, 1]) {
      const st = new THREE.Mesh(new THREE.BoxGeometry(locoLen * .98, .22, .02), stripe); st.position.set(0, deck + .45, s * (locoW / 2 + .07)); g.add(st);
      const win = new THREE.Mesh(new THREE.BoxGeometry(.05, .8, locoW * .78), glass); win.position.set(s * (locoLen / 2 - .52), deck + locoH * .74, 0); win.rotation.z = s * -.5; g.add(win);
      const nose = new THREE.Mesh(new THREE.BoxGeometry(.04, .5, locoW * .9), stripe); nose.position.set(s * (locoLen / 2 + .07), deck + .35, 0); g.add(nose);
    }
    const roof = new THREE.Mesh(new THREE.BoxGeometry(locoLen - 2.6, .25, locoW * .8), new THREE.MeshStandardMaterial({ color: '#6c6f72', roughness: .6, metalness: .4 })); roof.position.y = deck + locoH + .12; g.add(roof);
    // single-arm pantograph raised to the contact wire
    const panY = deck + locoH + .25, armLen = 5.6 - panY;
    const pb = new THREE.Mesh(new THREE.BoxGeometry(1.4, .12, 1.2), dark); pb.position.set(-4, panY + .06, 0); g.add(pb);
    const lower = new THREE.Mesh(new THREE.CylinderGeometry(.04, .04, armLen * 1.1, 8), dark); lower.position.set(-3.4, panY + armLen * .45, 0); lower.rotation.z = -.62; g.add(lower);
    const upper = new THREE.Mesh(new THREE.CylinderGeometry(.03, .03, armLen * 1.05, 8), dark); upper.position.set(-3.3, panY + armLen * .62, 0); upper.rotation.z = .55; g.add(upper);
    const head = new THREE.Mesh(new THREE.BoxGeometry(.12, .06, 1.9), new THREE.MeshStandardMaterial({ color: '#a9abad', metalness: .8, roughness: .3 })); head.position.set(-3.9, 5.6 - .03, 0); g.add(head);
    for (const bx of [-7, 0, 7]) { const bg = bogie(3.6, 2); bg.position.x = bx; g.add(bg); }
    g.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    locos.push(g); group.add(g);
  }
  // wagons: one merged geometry with material groups, instanced
  const wl = 10.2, ww = 2.95, wh = 2.25;
  const body = new THREE.BoxGeometry(wl, wh, ww); body.translate(0, 1.15 + wh / 2, 0);
  const ore = new THREE.SphereGeometry(1, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2); ore.scale(wl * .46, .55, ww * .44); ore.translate(0, 1.15 + wh, 0);
  const parts = [body, ore];
  for (const bx of [-wl / 2 + 1.6, wl / 2 - 1.6]) {
    const fr = new THREE.BoxGeometry(2.4, .5, 2.4); fr.translate(bx, .75, 0); parts.push(fr);
    for (const ax of [-.85, .85]) for (const s of [-1, 1]) { const wg = new THREE.CylinderGeometry(.46, .46, .13, 20); wg.rotateX(Math.PI / 2); wg.translate(bx + ax, .46, s * (GAUGE / 2 + .02)); parts.push(wg); }
  }
  const merged = mergeGeometries([body, ore, mergeGeometries(parts.slice(2))], true);
  const wagons = new THREE.InstancedMesh(merged, [
    new THREE.MeshStandardMaterial({ color: '#5a4a40', roughness: .8, metalness: .3 }),
    new THREE.MeshStandardMaterial({ color: '#6b2a1a', roughness: 1 }),
    dark], 60);
  wagons.castShadow = wagons.receiveShadow = true; group.add(wagons);

}
function placeTrain(T) {            // runs toward -x (loaded, towards Saldanha); T.x is the nose
  let x = T.x;
  for (const l of T.locos) { l.position.set(x + T.locoLen / 2, .012, 0); x += T.locoLen + .6; }
  const M4 = new THREE.Matrix4();
  for (let i = 0; i < T.wagons.count; i++) { M4.makeTranslation(x + T.wl / 2, .012, 0); T.wagons.setMatrixAt(i, M4); x += T.wl + .6; }
  T.wagons.instanceMatrix.needsUpdate = true;
  T.tail = x;
}

/* sun, sky and the simulated hot design day (thermal-model boundary conditions) */
const LVL = DATA.site.levels;   // example site levels (D-21)
function railAt(h) {
  const air = 35 + 10 * Math.cos(2 * Math.PI * (h - 15) / 24);
  const hl = h - 1, sl = hl >= 6 && hl <= 18 ? Math.max(0, Math.sin(Math.PI * (hl - 6) / 12)) : 0;
  return { air, rail: air - 1 + 26 * sl };
}
let hour = 14.0, envTimer = null;
function setHour(h) {
  hour = h;
  const elev = Math.max(-4, 62 * Math.sin(Math.PI * (h - 6) / 12));
  const az = -75 + 150 * clamp((h - 6) / 12);
  const phi = THREE.MathUtils.degToRad(90 - elev), theta = THREE.MathUtils.degToRad(az + 90);
  const sunV = new THREE.Vector3().setFromSphericalCoords(1, phi, theta);
  L.sky.material.uniforms.sunPosition.value.copy(sunV);
  const day = clamp(elev / 18);
  L.sun.intensity = 5.2 * day; L.sun.color.set('#ffd2a0').lerp(new THREE.Color('#fff4e4'), clamp(elev / 45));
  L.sun.position.copy(L.controls.target).addScaledVector(sunV, 120); L.sun.target.position.copy(L.controls.target);
  L.hemi.intensity = .2 + .7 * day;
  L.scene.fog.color.set('#2a2f3a').lerp(new THREE.Color('#e7c39a'), clamp((elev + 4) / 16)).lerp(new THREE.Color('#d9d4cc'), clamp((elev - 25) / 40) * .5);
  renderer.toneMappingExposure = .28 + .27 * clamp((elev + 4) / 20);
  clearTimeout(envTimer);
  envTimer = setTimeout(() => {           // image-based light matching the sky
    const sc = new THREE.Scene(); const sk = new Sky(); sk.scale.setScalar(1000); sk.material.uniforms.sunPosition.value.copy(sunV);
    for (const k of ['turbidity', 'rayleigh', 'mieCoefficient', 'mieDirectionalG']) sk.material.uniforms[k].value = L.sky.material.uniforms[k].value;
    sc.add(sk); const old = L.scene.environment; L.scene.environment = pmrem.fromScene(sc).texture; old?.dispose?.();
  }, 120);
  renderReadout();
}
function level(t) { return t >= LVL[2] ? 3 : t >= LVL[1] ? 2 : t >= LVL[0] ? 1 : 0; }
const LVLNAME = ['Normal', 'L1 watch', 'L2 restrict', 'L3 severe'];
const LVLCOL = ['--ok', '--warn', '--hot', '--crit'];
function renderReadout() {
  const { air, rail } = railAt(hour), lv = level(rail);
  const passing = L.train.running && L.train.x < unitAt.x && L.train.tail > unitAt.x;
  L.readout.style.setProperty('--lvl', css(LVLCOL[lv]));
  L.readout.innerHTML = `Rail ${rail.toFixed(1)} °C · ${LVLNAME[lv]}<small>Near-rail air ${(air + 4.5 * clamp(railAt(hour).rail - air, 0, 26) / 26).toFixed(1)} °C${passing ? ' · train passing' : ''}</small>`;
  const box = $('#line-read');
  if (box) {
    box.querySelector('.lvl').textContent = `${rail.toFixed(1)} °C`;
    box.querySelector('.chip').textContent = LVLNAME[lv];
    box.querySelector('.chip').style.color = css(LVLCOL[lv]);
    box.querySelector('.when').textContent = `${String(Math.floor(hour)).padStart(2, '0')}:${String(Math.round((hour % 1) * 60) % 60).padStart(2, '0')}`;
  }
}

  const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;

  for (const c of [U.cam, L.cam]) { c.aspect = w / h; c.updateProjectionMatrix(); }
}
new ResizeObserver(resize).observe(stage);

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!$('#view-3d').hidden) {
    if (view === 'unit') {
      updateExplode(now); camTween?.(now);
      if (autoSpin) U.unit.root.rotation.y = Math.sin(now / 5200) * .35;
      else U.unit.root.rotation.y *= .92;
      for (const q of U.unit.parts) if (q.p.id === selected) for (const m of q.mats) if (m.emissive) m.emissiveIntensity = .25 + .15 * Math.sin(now / 260);
      U.controls.update(); renderer.render(U.scene, U.cam); labelR.render(U.scene, U.cam);
    } else if (lineBuilt) {
      lTween?.(now);
      const T = L.train;
      if (T.running) {
        T.x -= T.speed * dt; placeTrain(T);
        if (T.tail < -800) { T.running = false; T.group.visible = false; T.x = 190; renderTools(); }
        renderReadout();
      }
      L.ring.scale.setScalar(1 + .25 * Math.sin(now / 420)); L.ring.material.opacity = .55 + .35 * Math.sin(now / 420);
      L.sun.position.copy(L.controls.target).add(L.sky.material.uniforms.sunPosition.value.clone().multiplyScalar(120));
      L.sun.target.position.copy(L.controls.target);
      L.controls.update(); renderer.render(L.scene, L.cam); labelR.render(L.scene, L.cam);
    }
  }
  requestAnimationFrame(frame);
}
setHint();
let start = 'unit';
try { const s = localStorage.getItem('rse-view'); if (['unit', 'line', 'parts'].includes(s)) start = s; } catch (e) { /* storage unavailable */ }
if (location.hash === '#line') start = 'line'; if (location.hash === '#parts') start = 'parts';
setView(start); applySku();
requestAnimationFrame(frame);
</script>
