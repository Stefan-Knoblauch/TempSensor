<title>Rail Sensor Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one-screen app. Brand bar (logo + views) on top; 3-D stage left; spec panel right (stacks on phones).
   Single light look built on the bigetron palette: navy text, logo blue for action, signal-arc colours for alarm levels. */
:root {
  color-scheme: light;
  --bg: #f3f6f9;           /* page ground */
  --surface: #ffffff;      /* bars, panel, cards */
  --line: #dbe3eb;         /* hairlines */
  --text: #16365c;         /* logo navy */
  --muted: #5f7286;        /* secondary text */
  --brand: #3d8cc6;        /* logo blue */
  --brand-ink: #ffffff;
  --stage-a: #ffffff; --stage-b: #dfe7ef;   /* studio backdrop */
  --ok: #5f9e3b; --warn: #d9a21b; --hot: #ee8130; --crit: #df4430;   /* signal arcs */
  --f-display: "Lexend", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 var(--f-body); overflow: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }

/* brand bar */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
.brand img { height: 46px; width: auto; display: block; }
.brand .prod { display: grid; gap: 2px; padding-left: 16px; border-left: 1px solid var(--line); min-width: 0; }
.brand h1 { margin: 0; font: 600 18px/1.1 var(--f-display); letter-spacing: -.01em; }
.brand span { font: 400 12px var(--f-mono); color: var(--muted); }
.tabs { display: flex; gap: 2px; margin-left: auto; padding: 3px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; }
.tab { background: none; border: 0; border-radius: 999px; padding: 7px 16px; cursor: pointer; font: 500 14px var(--f-display); color: var(--muted); }
.tab[aria-selected="true"] { color: var(--brand-ink); background: var(--text); }
.tab:hover:not([aria-selected="true"]) { color: var(--text); }
.seg { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.seg button { background: none; border: 0; padding: 6px 12px; cursor: pointer; font: 600 12px var(--f-mono); color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }
.signout { font: 500 13px var(--f-display); color: var(--muted); text-decoration: none; padding: 6px 10px; border-radius: 999px; }
.signout:hover { color: var(--brand); background: var(--bg); }

/* main */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 390px; min-height: 0; }
.stage { position: relative; min-height: 0; overflow: hidden; background: radial-gradient(120% 90% at 50% 38%, var(--stage-a), var(--stage-b)); }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.labels { position: absolute; inset: 0; pointer-events: none; }
.hint { position: absolute; left: 16px; top: 14px; max-width: 34ch; padding: 10px 14px; border-radius: 10px; background: rgba(255,255,255,.88); box-shadow: 0 6px 24px rgba(22,54,92,.12); font-size: 14px; color: var(--text); pointer-events: none; }
.hint b { display: block; font: 600 14px var(--f-display); color: var(--brand); margin-bottom: 2px; }
@media (max-width: 860px) { .hint.open { display: none; } }
.tools { position: absolute; left: 16px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: 6px; }
.tools button { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; font: 500 13px var(--f-display); box-shadow: 0 2px 8px rgba(22,54,92,.08); }
.tools button:hover { border-color: var(--brand); color: var(--brand); }
.tools button[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--brand-ink); }
.tools button.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }

.badge { pointer-events: none; visibility: hidden; cursor: pointer; font: 600 11px/1 var(--f-mono); color: var(--brand-ink); background: var(--text); border-radius: 10px; padding: 4px 6px; border: 2px solid var(--surface); transform: translateY(-14px); opacity: 0; transition: opacity .35s, background .2s; white-space: nowrap; box-shadow: 0 2px 6px rgba(22,54,92,.25); }
.badge.show { opacity: 1; pointer-events: auto; visibility: visible; }
.badge.sel { background: var(--brand); }
.badge .nm { display: none; font-family: var(--f-body); font-weight: 600; margin-left: 6px; }
.badge:hover .nm, .badge.sel .nm { display: inline; }
.readout { pointer-events: none; font: 600 12px/1.3 var(--f-mono); color: var(--text); background: rgba(255,255,255,.94); border-left: 4px solid var(--lvl, var(--ok)); padding: 7px 10px; border-radius: 6px; transform: translateY(-34px); white-space: nowrap; box-shadow: 0 4px 16px rgba(22,54,92,.18); }
.readout small { display: block; font-weight: 400; color: var(--muted); }

/* panel */
.panel { border-left: 1px solid var(--line); background: var(--surface); overflow-y: auto; padding: 20px 20px calc(24px + env(safe-area-inset-bottom, 0px)); min-width: 0; }
.panel h2 { margin: 2px 0 6px; font: 600 24px/1.15 var(--f-display); letter-spacing: -.015em; text-wrap: balance; }
.panel h3 { margin: 22px 0 8px; font: 600 12px var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.eyebrow { font: 600 12px var(--f-mono); color: var(--brand); }
.panel p { margin: 8px 0; max-width: 60ch; }
dl.kv { display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; margin: 10px 0; font-size: 14px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
.plist { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.plist button { width: 100%; display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: baseline; text-align: left; background: none; border: 0; border-radius: 6px; padding: 6px 8px; cursor: pointer; }
.plist button:hover { background: var(--bg); }
.plist button.sel { background: var(--brand); color: var(--brand-ink); }
.plist .r { font: 600 12px var(--f-mono); color: var(--muted); }
.plist button.sel .r, .plist button.sel .g { color: var(--brand-ink); }
.plist .g { font-size: 12px; color: var(--muted); }
.chip { display: inline-block; white-space: nowrap; font: 600 11px var(--f-mono); padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; }
.lvl { font: 600 38px/1 var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
input[type=range] { width: 100%; accent-color: var(--brand); }
.row { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer; font: 500 13px var(--f-display); }
.btn:hover { border-color: var(--brand); color: var(--brand); }
a { color: var(--brand); }
.note { font-size: 13px; color: var(--muted); }
.arcs { display: inline-flex; gap: 3px; vertical-align: middle; }
.arcs i { width: 8px; height: 8px; border-radius: 50%; display: block; }

/* parts view */
.sheet { overflow: auto; padding: 24px 16px calc(32px + env(safe-area-inset-bottom, 0px)); }
.sheet-inner { max-width: 1180px; margin: 0 auto; display: grid; gap: 18px; }
.sheet h2 { font: 600 28px/1.1 var(--f-display); letter-spacing: -.015em; margin: 4px 0 0; }
.totals { display: flex; flex-wrap: wrap; gap: 14px; }
.totals .t { display: grid; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; min-width: 170px; }
.totals .t span { font: 600 11px var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.totals .t b { font: 600 30px/1 var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 980px; font-size: 14px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 600 11px var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: var(--bg); position: sticky; top: 0; }
td.n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
tr.dim td { opacity: .4; }
.st-verified { color: var(--ok); } .st-from-search-snippet { color: var(--warn); } .st-estimate { color: var(--hot); } .st-not-found { color: var(--crit); }

@media (max-width: 860px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .stage { height: 62vh; min-height: 340px; }
  .panel { border-left: 0; border-top: 1px solid var(--line); }
  .tabs { margin-left: 0; }
  .brand img { height: 36px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

const $ = (s) => document.querySelector(s);

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const zar = (v) => v == null ? '—' : 'R ' + v.toLocaleString('en-ZA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

/* ------------------------------------------------------------------ rail profile */
function railShape(R, s = 1) {
  const { h, head, foot, web } = R;
  const hfE = .07 * h, hfW = .14 * h, hh = .27 * h;
  const pts = [[-foot / 2, 0], [foot / 2, 0], [foot / 2, hfE], [web / 2, hfW], [web / 2, h - hh],
    [head / 2, h - hh + .04 * h], [head / 2, h], [-head / 2, h], [-head / 2, h - hh + .04 * h],
    [-web / 2, h - hh], [-web / 2, hfW], [-foot / 2, hfE]];
  return new THREE.Shape(pts.map(([x, y]) => new THREE.Vector2(x * s, y * s)));
}
/** Extrude a cross-section (lateral = shape x -> world z, vertical = y) along world x, centred. */
function alongX(shape, length, opts = {}) {
  const g = new THREE.ExtrudeGeometry(shape, { depth: length, bevelEnabled: false, ...opts });
  g.translate(0, 0, -length / 2);
  g.rotateY(-Math.PI / 2);
  return g;
}

/* ------------------------------------------------------------------ unit model (mm) */
function material(p) {
  const c = new THREE.Color(p.color);
  switch (p.mat) {
    case 'polymer': return new THREE.MeshPhysicalMaterial({ color: c, roughness: .62, clearcoat: .18, clearcoatRoughness: .55 });
    case 'metal': return new THREE.MeshStandardMaterial({ color: c, metalness: 1, roughness: .26 });
    case 'rubber': return new THREE.MeshStandardMaterial({ color: c, roughness: .92 });
    case 'chip': return new THREE.MeshStandardMaterial({ color: c, roughness: .42, metalness: .1 });
    case 'cell': return new THREE.MeshPhysicalMaterial({ color: c, roughness: .32, clearcoat: .7, clearcoatRoughness: .2 });
    case 'pcb': return new THREE.MeshPhysicalMaterial({ color: c, roughness: .45, clearcoat: .5 });
    case 'metalcan': return new THREE.MeshStandardMaterial({ color: '#c8ccd1', metalness: .92, roughness: .32 });
    case 'glass': return new THREE.MeshPhysicalMaterial({ color: c, roughness: .08, transmission: .6, thickness: 1.5 });
    case 'flex': return new THREE.MeshStandardMaterial({ color: c, roughness: .38, metalness: .25 });
    case 'foam': return new THREE.MeshStandardMaterial({ color: c, roughness: 1 });
    default: return new THREE.MeshStandardMaterial({ color: c });
  }
}
const rbox = (w, h, d, r = .8) => new RoundedBoxGeometry(w, h, d, 3, Math.min(r, Math.min(w, h, d) / 2.2));
const axisRot = (m, axis) => { if (axis === 'x') m.rotation.z = Math.PI / 2; if (axis === 'z') m.rotation.x = Math.PI / 2; return m; };

function makePart(p, hookLen) {

      const [L, H, D] = p.size, w = B.wall;
      const front = new THREE.Shape();
      front.moveTo(-L / 2, -H / 2); front.lineTo(L / 2, -H / 2); front.lineTo(L / 2, H / 2); front.lineTo(-L / 2, H / 2); front.closePath();
      for (const x of [-POT.pitch, 0, POT.pitch]) {
        const hole = new THREE.Path(); hole.absarc(x, -p.pos[1], POT.d / 2 + .3, 0, Math.PI * 2, true); front.holes.push(hole);
      }
      const fg = new THREE.ExtrudeGeometry(front, { depth: w, bevelEnabled: true, bevelSize: .5, bevelThickness: .5, bevelSegments: 2, curveSegments: 48 });
      const fm = add(fg); fm.position.z = -D / 2;
      add(rbox(L, w, D, .6)).position.set(0, -H / 2 + w / 2, 0);
      for (const s of [-1, 1]) add(rbox(w, H, D, .6)).position.set(s * (L / 2 - w / 2), 0, 0);
      // head-stop rib on the web edge of the top, under the cap
      add(rbox(L - 8, 1.6, 6, .4)).position.set(0, H / 2 + .8, -D / 2 + 3);
      break;
    }
    case 'pot': {
      const r = p.d / 2, h = p.length;
      const cup = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 64), m); g.add(cup);
      const mag = new THREE.Mesh(new THREE.CylinderGeometry(r * .76, r * .76, .5, 64),
        new THREE.MeshStandardMaterial({ color: '#3a3d42', metalness: .7, roughness: .45 }));
      mag.position.y = -h / 2 - .05; g.add(mag);
      if (p.id !== 'potC') {
        const coat = new THREE.Mesh(new THREE.CylinderGeometry(r, r, .3, 64),

        coat.position.y = -h / 2 - .25; g.add(coat);
      }
      const chamfer = new THREE.Mesh(new THREE.TorusGeometry(r - .4, .45, 10, 64), m);
      chamfer.rotation.x = Math.PI / 2; chamfer.position.y = h / 2 - .1; g.add(chamfer);

        g.add(band);

  const pads = new THREE.InstancedMesh(new THREE.BoxGeometry(.18, .012, .16), new THREE.MeshStandardMaterial({ color: '#141414', roughness: .8 }), nSl * 2);
  const clipGeo = new THREE.TorusGeometry(.035, .009, 6, 12, Math.PI); clipGeo.rotateY(Math.PI / 2);
  const clips = new THREE.InstancedMesh(clipGeo, new THREE.MeshStandardMaterial({ color: '#3d3f42', metalness: .6, roughness: .5 }), nSl * 4);
  let ci = 0;
  for (let i = 0; i < nSl; i++) {
    const x = -LEN / 2 + i * .6;
    M4.makeTranslation(x, 0, 0); sleepers.setMatrixAt(i, M4);
    for (const [k, s] of [[0, -1], [1, 1]]) {

    for (const [y, len] of [[MW, 3.9], [CW + .25, 3.9]]) {

function buildTrain() {
  const group = new THREE.Group();
  const deck = 1.25;
  const locoLen = 21.6, locoW = 3.05, locoH = 3.15;
  const prof = new THREE.Shape([[0, 0], [locoLen, 0], [locoLen, locoH * .55], [locoLen - .9, locoH], [.9, locoH], [0, locoH * .55]].map(([x, y]) => new THREE.Vector2(x, y)));
  const bodyGeo = new THREE.ExtrudeGeometry(prof, { depth: locoW, bevelEnabled: true, bevelSize: .06, bevelThickness: .06, bevelSegments: 2 });
  bodyGeo.translate(-locoLen / 2, deck, -locoW / 2);
  const locoMat = new THREE.MeshPhysicalMaterial({ color: '#8f2a22', roughness: .45, clearcoat: .5 });
  const stripe = new THREE.MeshStandardMaterial({ color: '#e6b33a', roughness: .5 });
  const glass = new THREE.MeshPhysicalMaterial({ color: '#1d2a33', roughness: .05, metalness: .3, clearcoat: 1 });
  const dark = new THREE.MeshStandardMaterial({ color: '#1f1f20', roughness: .7, metalness: .3 });
  const wheel = new THREE.MeshStandardMaterial({ color: '#3a3836', metalness: .8, roughness: .45 });
  const locos = [];
  const bogie = (len, axles) => {
    const b = new THREE.Group();
    const fr = new THREE.Mesh(new THREE.BoxGeometry(len, .55, 2.5), dark); fr.position.y = .78; b.add(fr);
    for (let a = 0; a < axles; a++) for (const s of [-1, 1]) {
      const w = new THREE.Mesh(new THREE.CylinderGeometry(.53, .53, .14, 28), wheel); w.rotation.x = Math.PI / 2;
      w.position.set(-len / 2 + .55 + a * (len - 1.1) / Math.max(1, axles - 1), .53, s * (GAUGE / 2 + .02)); b.add(w);
    }
    return b;
  };
  for (let i = 0; i < 3; i++) {
    const g = new THREE.Group();
    g.add(new THREE.Mesh(bodyGeo, locoMat));
    for (const s of [-1, 1]) {
      const st = new THREE.Mesh(new THREE.BoxGeometry(locoLen * .98, .22, .02), stripe); st.position.set(0, deck + .45, s * (locoW / 2 + .07)); g.add(st);
      const win = new THREE.Mesh(new THREE.BoxGeometry(.05, .8, locoW * .78), glass); win.position.set(s * (locoLen / 2 - .52), deck + locoH * .74, 0); win.rotation.z = s * -.5; g.add(win);
      const nose = new THREE.Mesh(new THREE.BoxGeometry(.04, .5, locoW * .9), stripe); nose.position.set(s * (locoLen / 2 + .07), deck + .35, 0); g.add(nose);
    }
    const roof = new THREE.Mesh(new THREE.BoxGeometry(locoLen - 2.6, .25, locoW * .8), new THREE.MeshStandardMaterial({ color: '#6c6f72', roughness: .6, metalness: .4 })); roof.position.y = deck + locoH + .12; g.add(roof);
    // single-arm pantograph raised to the contact wire
    const panY = deck + locoH + .25, armLen = 5.6 - panY;
    const pb = new THREE.Mesh(new THREE.BoxGeometry(1.4, .12, 1.2), dark); pb.position.set(-4, panY + .06, 0); g.add(pb);
    const lower = new THREE.Mesh(new THREE.CylinderGeometry(.04, .04, armLen * 1.1, 8), dark); lower.position.set(-3.4, panY + armLen * .45, 0); lower.rotation.z = -.62; g.add(lower);
    const upper = new THREE.Mesh(new THREE.CylinderGeometry(.03, .03, armLen * 1.05, 8), dark); upper.position.set(-3.3, panY + armLen * .62, 0); upper.rotation.z = .55; g.add(upper);
    const head = new THREE.Mesh(new THREE.BoxGeometry(.12, .06, 1.9), new THREE.MeshStandardMaterial({ color: '#a9abad', metalness: .8, roughness: .3 })); head.position.set(-3.9, 5.6 - .03, 0); g.add(head);
    for (const bx of [-7, 0, 7]) { const bg = bogie(3.6, 2); bg.position.x = bx; g.add(bg); }
    g.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    locos.push(g); group.add(g);

  const wl = 10.2, ww = 2.95, wh = 2.25;
  const body = new THREE.BoxGeometry(wl, wh, ww); body.translate(0, 1.15 + wh / 2, 0);
  const ore = new THREE.SphereGeometry(1, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2); ore.scale(wl * .46, .55, ww * .44); ore.translate(0, 1.15 + wh, 0);
  const parts = [body, ore];
  for (const bx of [-wl / 2 + 1.6, wl / 2 - 1.6]) {
    const fr = new THREE.BoxGeometry(2.4, .5, 2.4); fr.translate(bx, .75, 0); parts.push(fr);
    for (const ax of [-.85, .85]) for (const s of [-1, 1]) { const wg = new THREE.CylinderGeometry(.46, .46, .13, 20); wg.rotateX(Math.PI / 2); wg.translate(bx + ax, .46, s * (GAUGE / 2 + .02)); parts.push(wg); }
  }
  const merged = mergeGeometries([body, ore, mergeGeometries(parts.slice(2))], true);
  const wagons = new THREE.InstancedMesh(merged, [
    new THREE.MeshStandardMaterial({ color: '#5a4a40', roughness: .8, metalness: .3 }),

}
function placeTrain(T) {            // runs toward -x (loaded, towards Saldanha); T.x is the nose
  let x = T.x;
  for (const l of T.locos) { l.position.set(x + T.locoLen / 2, .012, 0); x += T.locoLen + .6; }
  const M4 = new THREE.Matrix4();
  for (let i = 0; i < T.wagons.count; i++) { M4.makeTranslation(x + T.wl / 2, .012, 0); T.wagons.setMatrixAt(i, M4); x += T.wl + .6; }

/* sun, sky and the simulated hot design day (thermal-model boundary conditions) */
const LVL = DATA.site.levels;   // example site levels (D-21)
function railAt(h) {
  const air = 35 + 10 * Math.cos(2 * Math.PI * (h - 15) / 24);
  const hl = h - 1, sl = hl >= 6 && hl <= 18 ? Math.max(0, Math.sin(Math.PI * (hl - 6) / 12)) : 0;
  return { air, rail: air - 1 + 26 * sl };
}
let hour = 14.0, envTimer = null;
function setHour(h) {
  hour = h;
  const elev = Math.max(-4, 62 * Math.sin(Math.PI * (h - 6) / 12));
  const az = -75 + 150 * clamp((h - 6) / 12);
  const phi = THREE.MathUtils.degToRad(90 - elev), theta = THREE.MathUtils.degToRad(az + 90);
  const sunV = new THREE.Vector3().setFromSphericalCoords(1, phi, theta);
  L.sky.material.uniforms.sunPosition.value.copy(sunV);
  const day = clamp(elev / 18);
  L.sun.intensity = 5.2 * day; L.sun.color.set('#ffd2a0').lerp(new THREE.Color('#fff4e4'), clamp(elev / 45));
  L.sun.position.copy(L.controls.target).addScaledVector(sunV, 120); L.sun.target.position.copy(L.controls.target);
  L.hemi.intensity = .2 + .7 * day;
  L.scene.fog.color.set('#2a2f3a').lerp(new THREE.Color('#e7c39a'), clamp((elev + 4) / 16)).lerp(new THREE.Color('#d9d4cc'), clamp((elev - 25) / 40) * .5);
  renderer.toneMappingExposure = .28 + .27 * clamp((elev + 4) / 20);
  clearTimeout(envTimer);
  envTimer = setTimeout(() => {           // image-based light matching the sky
    const sc = new THREE.Scene(); const sk = new Sky(); sk.scale.setScalar(1000); sk.material.uniforms.sunPosition.value.copy(sunV);
    for (const k of ['turbidity', 'rayleigh', 'mieCoefficient', 'mieDirectionalG']) sk.material.uniforms[k].value = L.sky.material.uniforms[k].value;
    sc.add(sk); const old = L.scene.environment; L.scene.environment = pmrem.fromScene(sc).texture; old?.dispose?.();
  }, 120);
  renderReadout();
}
function level(t) { return t >= LVL[2] ? 3 : t >= LVL[1] ? 2 : t >= LVL[0] ? 1 : 0; }
const LVLNAME = ['Normal', 'L1 watch', 'L2 restrict', 'L3 severe'];
const LVLCOL = ['--ok', '--warn', '--hot', '--crit'];
function renderReadout() {
  const { air, rail } = railAt(hour), lv = level(rail);
  const passing = L.train.running && L.train.x < unitAt.x && L.train.tail > unitAt.x;
  L.readout.style.setProperty('--lvl', css(LVLCOL[lv]));
  L.readout.innerHTML = `Rail ${rail.toFixed(1)} °C · ${LVLNAME[lv]}<small>Near-rail air ${(air + 4.5 * clamp(railAt(hour).rail - air, 0, 26) / 26).toFixed(1)} °C${passing ? ' · train passing' : ''}</small>`;
  const box = $('#line-read');
  if (box) {
    box.querySelector('.lvl').textContent = `${rail.toFixed(1)} °C`;
    box.querySelector('.chip').textContent = LVLNAME[lv];
    box.querySelector('.chip').style.color = css(LVLCOL[lv]);
    box.querySelector('.when').textContent = `${String(Math.floor(hour)).padStart(2, '0')}:${String(Math.round((hour % 1) * 60) % 60).padStart(2, '0')}`;
  }
}

}
function renderParts() {
  const src = DATA.sourcing, inner = $('#parts-inner');
  if (!src || !src.parts?.length) { inner.innerHTML = '<h2>Parts &amp; sourcing</h2><p>No sourcing data was bundled.</p>'; return; }
  const rows = src.parts.map((s) => {
    const on = s.sku === 'both' || s.sku === sku;
    const ext = s.unit_price_zar != null ? s.unit_price_zar * s.qty : null;
    const alts = (s.alternatives || []).map((a) => `${a.url ? `<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.supplier)}</a>` : esc(a.supplier)}${a.unit_price_zar != null ? ` ${zar(a.unit_price_zar)}` : ''}`).join('<br>');
    return { on, ext, html: `<tr class="${on ? '' : 'dim'}"><td>${esc(s.name)}<div class="note">${esc(s.notes || '')}</div></td>
      <td class="n">${s.qty}</td><td class="n">${zar(s.unit_price_zar)}</td><td class="n">${zar(ext)}</td>
      <td>${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.supplier)}</a>` : esc(s.supplier || '—')}<div class="note">${esc(s.price_basis || '')}</div></td>
      <td><span class="chip st-${esc(s.status)}">${esc(s.status)}</span></td><td class="note">${alts}</td></tr>` };
  });
  const total = rows.filter((r) => r.on && r.ext != null).reduce((a, r) => a + r.ext, 0);
  const missing = rows.filter((r) => r.on && r.ext == null).length;
  inner.innerHTML = `<div><div class="eyebrow">Prototype quantity · South African online suppliers · checked ${esc(src.checked)}</div><h2>Parts &amp; sourcing</h2></div>
    <div class="totals"><div class="t"><span>${sku === 'lora' ? 'LoRa' : 'LTE-M'} unit, priced items</span><b>${zar(total)}</b></div>
      <div class="t"><span>Items without a price</span><b>${missing}</b></div>
      <div class="t"><span>Exchange rate used</span><b>${src.fx?.USD_ZAR ? 'R ' + src.fx.USD_ZAR.toFixed(2) + ' / $' : '—'}</b></div></div>
    <p class="note">${esc(src.vat_note || '')} Status: <span class="st-verified">verified</span> = price read on the supplier page; <span class="st-from-search-snippet">from-search-snippet</span> = price seen in search results only; <span class="st-estimate">estimate</span> = no SA listing found, estimated; <span class="st-not-found">not-found</span>. Prices are one-off prototype prices, not volume quotes; switch LoRa / LTE-M at the top.</p>
    <div class="tablewrap"><table><thead><tr><th>Part</th><th>Qty</th><th>Unit</th><th>Line</th><th>Supplier</th><th>Status</th><th>Alternatives</th></tr></thead><tbody>${rows.map((r) => r.html).join('')}</tbody></table></div>`;
}

/* ------------------------------------------------------------------ tabs, sku, loop */
function setView(v) {
  view = v;
  for (const [id, name] of [['#tab-unit', 'unit'], ['#tab-line', 'line'], ['#tab-parts', 'parts']]) $(id).setAttribute('aria-selected', String(v === name));
  $('#view-3d').hidden = v === 'parts'; $('#view-parts').hidden = v !== 'parts';
  if (v === 'line' && !lineBuilt) { buildLine(); lineBuilt = true; applySku(); L.cam.position.copy(LV.side.pos); L.controls.target.copy(LV.side.target); setHour(hour); lineView('close'); }
  U.controls.enabled = v === 'unit'; L.controls.enabled = v === 'line';
  U.unit.parts.forEach((q) => q.badge && (q.badge.style.display = v === 'unit' ? '' : 'none'));
  if (L.readout) L.readout.style.display = v === 'line' ? '' : 'none';
  hint.hidden = v !== 'unit';
  renderTools(); renderPanel(); renderParts(); resize();
  try { localStorage.setItem('rse-view', v); } catch (e) { /* storage unavailable */ }
}
$('#tab-unit').onclick = () => setView('unit'); $('#tab-line').onclick = () => setView('line'); $('#tab-parts').onclick = () => setView('parts');
for (const k of ['lora', 'ltem']) $('#sku-' + k).onclick = () => { sku = k; $('#sku-lora').setAttribute('aria-pressed', String(k === 'lora')); $('#sku-ltem').setAttribute('aria-pressed', String(k === 'ltem')); applySku(); renderPanel(); };

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h, false); labelR.setSize(w, h);
  for (const c of [U.cam, L.cam]) { c.aspect = w / h; c.updateProjectionMatrix(); }
}
new ResizeObserver(resize).observe(stage);

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!$('#view-3d').hidden) {
    if (view === 'unit') {
      updateExplode(now); camTween?.(now);
      if (autoSpin) U.unit.root.rotation.y = Math.sin(now / 5200) * .35;
      else U.unit.root.rotation.y *= .92;
      for (const q of U.unit.parts) if (q.p.id === selected) for (const m of q.mats) if (m.emissive) m.emissiveIntensity = .35 + .15 * Math.sin(now / 260);
      U.controls.update(); renderer.render(U.scene, U.cam); labelR.render(U.scene, U.cam);
    } else if (lineBuilt) {
      lTween?.(now);
      const T = L.train;
      if (T.running) {
        T.x -= T.speed * dt; placeTrain(T);
        if (T.tail < -800) { T.running = false; T.group.visible = false; T.x = 190; renderTools(); }
        renderReadout();
      }
      L.ring.scale.setScalar(1 + .25 * Math.sin(now / 420)); L.ring.material.opacity = .55 + .35 * Math.sin(now / 420);
      L.sun.position.copy(L.controls.target).add(L.sky.material.uniforms.sunPosition.value.clone().multiplyScalar(120));
      L.sun.target.position.copy(L.controls.target);
      L.controls.update(); renderer.render(L.scene, L.cam); labelR.render(L.scene, L.cam);
    }
  }
  requestAnimationFrame(frame);
}
setHint();
let start = 'unit';
try { const s = localStorage.getItem('rse-view'); if (['unit', 'line', 'parts'].includes(s)) start = s; } catch (e) { /* storage unavailable */ }
if (location.hash === '#line') start = 'line'; if (location.hash === '#parts') start = 'parts';
setView(start); applySku();
requestAnimationFrame(frame);
</script>
